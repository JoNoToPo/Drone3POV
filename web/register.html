<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Drone3POV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="register">
  <nav id="nav"></nav>

  <main>
    <section class="card narrow">
      <h1 id="heading"></h1>
      <form id="form">
        <label for="email" id="email-label"></label>
        <input type="email" id="email" autocomplete="email" required>

        <label for="password" id="password-label"></label>
        <input type="password" id="password" autocomplete="new-password" required>

        <button type="submit" class="primary" id="submit"></button>
      </form>
      <p class="msg" id="message" hidden></p>
      <p><span id="switch-text"></span> <a href="login.html" id="switch-link"></a></p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/api.js"></script>
  <script src="js/page.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
