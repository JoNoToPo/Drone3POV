<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Drone3POV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="nav"></nav>

  <main>
    <h1 id="heading"></h1>
    <p class="msg" id="page-message" hidden></p>

    <div id="content" hidden>
      <section class="card">
        <h2 id="users-title"></h2>
        <table>
          <thead>
            <tr>
              <th id="col-id"></th>
              <th id="col-email"></th>
              <th id="col-role"></th>
              <th id="col-created"></th>
              <th id="col-requests"></th>
            </tr>
          </thead>
          <tbody id="users"></tbody>
        </table>
      </section>

      <section class="card">
        <h2 id="endpoints-title"></h2>
        <table>
          <thead>
            <tr>
              <th id="col-method"></th>
              <th id="col-endpoint"></th>
              <th id="col-endpoint-requests"></th>
            </tr>
          </thead>
          <tbody id="endpoints"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/api.js"></script>
  <script src="js/page.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
